<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leoqo · interactive device preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#112832;color:#eaf0ed;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{padding:18px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;width:100%;border-bottom:1px solid #34505a}strong{font-size:20px;letter-spacing:-.5px}span{color:#b2c5c7;font-size:12px}button,select{font:inherit;font-size:12px;border:1px solid #49646c;border-radius:7px;padding:9px;background:#1b3d48;color:#fff;cursor:pointer}main{padding:22px 8px;display:flex;justify-content:center;max-width:100%}.device{border:7px solid #36525c;border-radius:35px;overflow:hidden;box-shadow:0 20px 65px #061b24;max-width:calc(100vw - 16px);background:#f3f5f4}iframe{display:block;border:0;width:390px;height:790px;max-width:100%}footer{font-size:12px;color:#a9c0c2;padding:0 20px 25px;text-align:center;max-width:550px;line-height:1.6}
</style></head><body><header><strong>leoqo<span style="color:#f4cf55">.</span></strong><span>Visual edition · live app preview</span><select aria-label="Screen size" id="size"><option value="390,790">Phone · 390 × 790</option><option value="360,740">Small Android · 360 × 740</option><option value="430,850">Large phone · 430 × 850</option><option value="768,920">Tablet · 768 × 920</option></select><button id="reload">Reload app</button></header><main><div class="device"><iframe title="Leoqo interactive phone preview" src="/"></iframe></div></main><footer>This runs the actual Expo web app at a phone viewport. It is a browser device preview, not an Android emulator or an iOS simulator.</footer><script>const frame=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px'};document.querySelector('#reload').onclick=()=>frame.contentWindow.location.reload();</script></body></html>
