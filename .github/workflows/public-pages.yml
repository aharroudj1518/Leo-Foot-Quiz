name: Public privacy and support pages
on:
  workflow_dispatch:
  push:
    branches: [codex/site-diagnostics]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact public URLs without authentication
        run: node scripts/check-public-pages.mjs
