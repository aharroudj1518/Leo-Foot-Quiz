name: App checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - name: Verify exported privacy and support pages
        run: node -e "for (const file of ['privacy.html', 'support.html', 'legal.css']) if (!require('node:fs').existsSync('dist/' + file)) throw new Error('Missing exported public file ' + file)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Capture phone web previews
        run: |
          python -m http.server 8081 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/leoqo-screenshot-server.log" 2>&1 &
          npm run store:screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-web-previews
          path: store-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
