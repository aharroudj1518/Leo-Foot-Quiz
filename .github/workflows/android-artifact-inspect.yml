name: Inspect signed Android artifact

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact finished EAS Android build ID
        type: string
        required: true
      source_commit:
        description: Full source SHA used to create that build
        type: string
        required: true
      minimum_version_code:
        description: Minimum accepted Android version code
        type: string
        default: '7'
      upload_certificate_sha256:
        description: Optional expected Play upload certificate SHA-256 fingerprint
        type: string
        required: false
  push:
    branches: [codex/artifact-inspect]
  workflow_run:
    workflows: [Android release]
    types: [completed]
    branches: [codex/play-release]

permissions:
  contents: read
  actions: read

concurrency:
  group: leoqo-android-artifact-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'aharroudj1518/Leo-Foot-Quiz' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == 'aharroudj1518/Leo-Foot-Quiz' &&
       github.event.workflow_run.head_branch == 'codex/play-release' &&
       github.event.workflow_run.head_sha == '089b8ed12c397e18aed059b99173088fafa15c52')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Exact candidate from the reviewed release run; never select a latest build.
      INSPECT_BUILD_ID: ${{ inputs.build_id || '9d9d1a37-3fe9-4d41-83a1-8bea6745cd74' }}
      INSPECT_SOURCE_COMMIT: ${{ inputs.source_commit || '089b8ed12c397e18aed059b99173088fafa15c52' }}
      INSPECT_MIN_VERSION_CODE: ${{ inputs.minimum_version_code || '7' }}
      INSPECT_UPLOAD_CERT_SHA256: ${{ inputs.upload_certificate_sha256 || vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - name: Verify the exact completed release before automatic inspection
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const upstream = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: upstream.id });
            const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: run.workflow_id });
            if (`${owner}/${repo}`.toLowerCase() !== 'aharroudj1518/leo-foot-quiz' ||
                run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'push' ||
                run.head_repository?.full_name?.toLowerCase() !== 'aharroudj1518/leo-foot-quiz' ||
                run.head_branch !== 'codex/play-release' || run.head_sha !== '089b8ed12c397e18aed059b99173088fafa15c52' ||
                workflow.path !== '.github/workflows/android-release.yml' ||
                process.env.INSPECT_BUILD_ID !== '9d9d1a37-3fe9-4d41-83a1-8bea6745cd74' ||
                process.env.INSPECT_SOURCE_COMMIT !== '089b8ed12c397e18aed059b99173088fafa15c52' ||
                process.env.INSPECT_MIN_VERSION_CODE !== '7') throw new Error('Automatic inspection is restricted to the exact reviewed version 7 release.');
            core.info('Exact successful version 7 release verified. This follow-on only inspects its existing signed artifact.');
      - uses: actions/checkout@v4
        with:
          # workflow_run uses trusted default-branch code, never upstream event code.
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate exact inspection inputs
        run: node --input-type=module -e "import {inspectionInputs} from './scripts/inspect-android-artifact.mjs'; inspectionInputs(process.env);"
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check inspection regressions
        run: node --test --test-isolation=none tests/artifact-inspection-offline.test.mjs tests/signature-offline.test.mjs
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Inspect the existing signed AAB without rebuilding or submitting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/inspect-android-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: leoqo-android-inspection-report-${{ github.run_id }}
          path: |
            artifacts/android-inspection/inspection-report.json
            artifacts/android-inspection/manifest-summary.json
            artifacts/android-inspection/README.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: leoqo-signed-android-aab-${{ github.run_id }}
          path: artifacts/android-inspection/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
