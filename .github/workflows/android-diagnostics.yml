name: Android build diagnostics
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Exact Expo build ID to inspect
        type: string
        required: false
      source_commit:
        description: Exact source commit to find when the build ID is unknown
        type: string
        required: false
  push:
    branches: [codex/play-release]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-diagnostics]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: ${{ inputs.build_id || '' }}
      SOURCE_COMMIT: ${{ inputs.source_commit || (github.event_name == 'push' && 'faeb0a4e6328d11166478dc34ad7c09650daa58c') || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate diagnostic target
        run: node -e 'const e=process.env; if ((!e.BUILD_ID && !e.SOURCE_COMMIT) || (e.BUILD_ID && !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(e.BUILD_ID)) || (e.SOURCE_COMMIT && !/^[0-9a-f]{40}$/i.test(e.SOURCE_COMMIT))) { console.error("Supply a valid exact build ID or full source commit."); process.exit(1); }'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Read builds for the exact source commit
        if: env.BUILD_ID == ''
        continue-on-error: true
        run: eas build:list --platform android --build-profile production-paid --git-commit-hash "$SOURCE_COMMIT" --limit 5 --json --non-interactive > "$RUNNER_TEMP/leoqo-diagnostic-list.json" 2> "$RUNNER_TEMP/leoqo-diagnostic-list-error.txt"
      - name: Select one exact diagnostic build
        id: target
        run: |
          if [ -n "$BUILD_ID" ]; then
            printf 'build_id=%s\n' "$BUILD_ID" >> "$GITHUB_OUTPUT"
          else
            node scripts/diagnose-android-build.mjs --select-source "$RUNNER_TEMP/leoqo-diagnostic-list.json"
          fi
      - name: Read exact build metadata
        continue-on-error: true
        env:
          BUILD_ID: ${{ steps.target.outputs.build_id }}
        run: eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/leoqo-diagnostic.json" 2> "$RUNNER_TEMP/leoqo-diagnostic-error.txt"
      - name: Read redacted build failure details
        env:
          BUILD_ID: ${{ steps.target.outputs.build_id }}
        run: node scripts/diagnose-android-build.mjs "$RUNNER_TEMP/leoqo-diagnostic.json" "$RUNNER_TEMP/leoqo-diagnostic-error.txt"
