name: Android native smoke from inspected AAB

on:
  workflow_dispatch:
    inputs:
      inspection_run_id:
        description: Exact successful Android artifact inspection workflow run ID
        type: string
        required: true
  push:
    branches: [codex/android-smoke]

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-smoke:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the exact successful inspection run
        id: inspection
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ inputs.inspection_run_id || '' }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message || '' }}
        with:
          script: |
            const markers = [...process.env.PUSH_MESSAGE.matchAll(/\[android-smoke:(\d+)\]/g)];
            const raw = process.env.REQUESTED_RUN_ID || (markers.length === 1 ? markers[0][1] : '');
            if (!/^[1-9]\d{0,15}$/.test(raw) || !Number.isSafeInteger(Number(raw))) throw new Error('Provide one exact inspection run ID. Push marker: [android-smoke:<run-id>].');
            const { owner, repo } = context.repo;
            if (`${owner}/${repo}`.toLowerCase() !== 'aharroudj1518/leo-foot-quiz') throw new Error('Unexpected repository.');
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(raw) });
            const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: run.workflow_id });
            if (run.status !== 'completed' || run.conclusion !== 'success' || workflow.path !== '.github/workflows/android-artifact-inspect.yml' || run.head_repository?.full_name?.toLowerCase() !== 'aharroudj1518/leo-foot-quiz') throw new Error('The exact run must be a successful inspection from this repository.');
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: Number(raw), per_page: 100 });
            for (const name of [`leoqo-android-inspection-report-${raw}`, `leoqo-signed-android-aab-${raw}`]) {
              const matches = data.artifacts.filter(item => item.name === name && !item.expired);
              if (matches.length !== 1) throw new Error('The exact run must contain one unexpired report and one signed AAB artifact.');
            }
            core.setOutput('run_id', raw);
            core.info(`Verified successful inspection run ${raw}. No build or Play action requested.`);
      - uses: actions/download-artifact@v4
        with:
          name: leoqo-android-inspection-report-${{ steps.inspection.outputs.run_id }}
          path: android-inspection
          run-id: ${{ steps.inspection.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: leoqo-signed-android-aab-${{ steps.inspection.outputs.run_id }}
          path: android-inspection
          run-id: ${{ steps.inspection.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Read the question bank from the native build's exact source
        uses: actions/checkout@v4
        with:
          ref: faeb0a4e6328d11166478dc34ad7c09650daa58c
          path: native-source
          persist-credentials: false
          sparse-checkout: src/content/questions.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch pinned official bundletool
        run: |
          curl --fail --location --retry 2 --proto '=https' --tlsv1.2 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/leoqo-bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$RUNNER_TEMP/leoqo-bundletool.jar" | sha256sum --check --status
      - name: Verify unchanged AAB and prepare a disposable test-signed emulator APK
        env:
          INSPECTION_RUN_ID: ${{ steps.inspection.outputs.run_id }}
          BUNDLETOOL_PATH: ${{ runner.temp }}/leoqo-bundletool.jar
        run: node scripts/prepare-android-smoke.mjs android-inspection "$RUNNER_TEMP/leoqo-native-smoke" native-smoke
      - name: Enable runner KVM for the isolated emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the actual native app on API 36
        id: emulator
        # v2.38.0; no Play Store image, account login, EAS build or payment step.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 25
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-native-smoke.py "$RUNNER_TEMP/leoqo-native-smoke/universal.apk" native-source/src/content/questions.json native-smoke
      - name: Record whether native verification actually ran
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: python3 scripts/android-native-smoke.py --finalize native-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leoqo-native-android-smoke-${{ github.run_id }}
          path: native-smoke
          if-no-files-found: ignore
          retention-days: 14
